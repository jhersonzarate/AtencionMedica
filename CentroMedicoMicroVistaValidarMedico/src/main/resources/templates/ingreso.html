<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ingreso del médico · Centro Médico</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono&family=IBM+Plex+Sans:wght@400;600&family=Source+Serif+4:wght@600&display=swap">
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body class="pantalla-ingreso">
    <aside class="marca">
        <div>
            <h1 class="marca-titulo">Centro Médico</h1>
            <p class="marca-sub">Atención médica</p>
        </div>
        <p class="nota">Acceso restringido al personal médico</p>
    </aside>

    <main class="zona-formulario">
        <section class="formulario">
            <h2>Ingreso del médico</h2>

            <div class="aviso" role="alert" th:if="${error}" th:text="${error}"></div>

            <form th:action="@{/ingreso}" method="post" autocomplete="off">
                <div class="campo">
                    <label class="etiqueta" for="idMedico">Código de médico</label>
                    <input id="idMedico" name="idMedico" type="text" inputmode="numeric"
                           th:value="${idMedico}" required autofocus>
                </div>
                <div class="campo con-mostrar">
                    <label class="etiqueta" for="pass">Contraseña</label>
                    <input id="pass" name="pass" type="password" autocomplete="current-password" required>
                    <button type="button" class="mostrar" data-mostrar="pass">Mostrar</button>
                </div>
                <button class="boton" type="submit">Ingresar</button>
            </form>

            <p class="pie">¿Primera vez en el sistema? <a th:href="@{/registro}">Registrar médico</a></p>
        </section>
    </main>
    <script th:src="@{/js/mostrar.js}"></script>
</body>
</html>
